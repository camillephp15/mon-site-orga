<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Organisation Personnelle</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            solaire: {
              50: '#fff5f5',
              100: '#ffe3e8',
              200: '#ffccd6',
              300: '#ffa3b5',
              400: '#ff668a',
              500: '#ff3366', // Rose vif / Pop Coral
              600: '#f41b52',
              700: '#ce0f3e',
              800: '#aa1138',
              900: '#8d1334',
            },
            orangePop: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316', // Orange Solaire
              600: '#ea580c',
              700: '#c2410c',
            },
            creme: {
              50: '#ffffff',
              100: '#fcfaf6', // Fond clair chaleureux
              200: '#f7f3eb',
              300: '#eee7da',
              400: '#ded4c1',
              500: '#c7b79d',
            },
            ink: {
              DEFAULT: '#0f0f12', // Noir profond
              light: '#18181c',
              muted: '#52525b',
              darkcard: '#16161b', // Surface sombre
              darkbg: '#0a0a0d',   // Fond sombre ultra-profond
              border: '#272730'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans (Nette, élégante, ultra-lisible) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- KaTeX for LaTeX Math rendering (flashcards) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-creme-100 dark:bg-ink-darkbg text-ink dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-200 antialiased selection:bg-solaire-500 selection:text-white">

  <!-- Top Navigation Bar - Navigation parfaitement centrée et sans StudyFlow -->
  <header class="sticky top-0 z-40 bg-creme-100/90 dark:bg-ink-darkbg/90 backdrop-blur-md border-b border-creme-300 dark:border-ink-border transition-colors">
    <div class="max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="relative flex items-center justify-between h-16">
        
        <!-- Left Quick Links: Moodle & Portail Étudiant (ESILV) - Sans bordure, dessin en noir -->
        <div class="flex items-center gap-3 sm:gap-7 flex-shrink-0 min-w-[96px] ml-20">
          <!-- Bouton Moodle (learning.devinci.fr) -->
          <a href="https://learning.devinci.fr/my/" target="_blank" rel="noopener noreferrer" 
             title="Moodle DeVinci" 
             class="group p-1 text-black dark:text-white hover:opacity-70 transition-all duration-150 flex items-center justify-center border-0 outline-none focus:outline-none"
             aria-label="Accéder à Moodle DeVinci">
            <svg width="26" height="26" viewBox="2 5 16.5 12" fill="currentColor" class="w-6 h-6 transition-transform duration-150 group-hover:scale-110">
              <path d="M13.1348 5.7402l.0351.123-2.7363 1.9903c.3694.2606.7968.609 1.0078.8438l.0762.1035c-1.2878 2.2571-3.737 3.0557-6.3164 2.1816l.0195-.1601h-.002c-.0784-.5679-.0962-1.0524-.0585-1.463-.7507-.003-1.5298-.0402-2.2832-.0663l-.5157.0175c-.0994.8449-.0351 2.135-.0254 2.3223.3492 1.2819.2977 2.2907.295 3.5293-.4134-1.0028-.8995-2.097-.416-3.4668l-.0098-.3183c-.0007-.0143-.0683-1.1532.037-2.0625l-.4081.0136-.0371-.1191C5.7922 6.8402 8.5032 6.218 13.1348 5.7402Zm1.623 2.5137c1.2202 0 2.1885.2691 2.9043.8066.8138.601 1.2207 1.4866 1.2207 2.6582v5.6856h-2.7344v-5.3691c0-1.1225-.4634-1.6836-1.3906-1.6836-.9278 0-1.3906.561-1.3906 1.6836v5.3691h-2.7344v-5.3691c0-.5183-.0986-.9144-.293-1.1934.6172-.435 1.1534-1.0124 1.5723-1.7246.0297.029.0597.0574.0879.0879.5044-.6349 1.4233-.9512 2.7578-.9512zm-9.6094 3.2344c.932.3 1.8614.393 2.7364.287a3.5455 3.5455 0 0 0-.0098.2599v5.3691H5.1426v-5.6855c0-.0787.0022-.1544.0058-.2305z"/>
            </svg>
          </a>

          <!-- Bouton Portail Étudiant (my.devinci.fr) - Logo ESILV -->
          <a href="https://my.devinci.fr/" target="_blank" rel="noopener noreferrer" 
             title="Portail Étudiant DeVinci (ESILV)" 
             class="group p-1 text-black dark:text-white hover:opacity-70 transition-all duration-150 flex items-center justify-center border-0 outline-none focus:outline-none"
             aria-label="Accéder au Portail Étudiant ESILV (myDevinci)">
            <svg width="30" height="24" viewBox="44 26 186 140" fill="currentColor" class="h-6 w-auto transition-transform duration-150 group-hover:scale-110">
              <!-- Da Vinci V Emblem -->
              <path d="M114.85,42.35l-10.74,20.9s-10.24-16-5.04-25.14c4.4-6.83,10.82-3.68,11.75-2.94.93.74,3.75,2.29,4.03,7.18Z"/>
              <path d="M73.67,37.01h-11.85l27.91,54.06h0c3.82-2.82,5.5-12.31,1.71-19.65"/>
              <!-- ESILV Text -->
              <path d="M46.27,114.1c0-1,.47-1.47,1.47-1.47h33.2c1,0,1.47.47,1.47,1.47v8.55c0,.94-.47,1.47-1.47,1.47h-21.77v8.22h16.56c1,0,1.6.53,1.6,1.54v6.88c0,1-.53,1.47-1.6,1.47h-16.56v8.55h22.44c.93,0,1.47.53,1.47,1.47v8.48c0,1-.53,1.47-1.47,1.47h-33.86c-1,0-1.47-.47-1.47-1.47v-46.62Z"/>
              <path d="M101.04,149.04c2.2,1.47,4.47,2.4,6.88,2.4,4.61,0,5.94-2.2,5.94-4.68,0-2.81-4.81-4.27-7.21-5.14-10.75-3.67-16.03-8.55-16.03-16.3,0-8.28,6.95-13.76,17.7-13.76,4.01,0,7.82.87,11.36,2.87,3.01,1.74,5.61,3.87,5.61,5.08,0,.53-.33,1-.87,1.6l-5.14,5.48c-.4.4-.73.53-1.14.53-.6,0-1.07-.4-1.67-.94l-.33-.27c-1.74-1.47-4.47-3.34-7.28-3.34s-5.41.87-5.41,3.41,2.54,3.47,7.41,5.08c9.48,3.14,16.3,6.35,16.3,15.63,0,9.75-8.48,16.16-19.37,16.16-6.88,0-13.89-3.74-18.17-8.48l-.13-.07c-.07-.13-.2-.2-.27-.27-.53-.6-.74-1-.74-1.34,0-.4.27-.8.74-1.27l5.81-5.54c.47-.33.8-.47,1.13-.47.4,0,.8.27,1.4.8.8.6,2,1.74,3.47,2.81Z"/>
              <path d="M135.31,114.1c0-1,.47-1.47,1.4-1.47h10.02c.93,0,1.47.47,1.47,1.47v46.62c0,1-.53,1.47-1.47,1.47h-10.02c-.94,0-1.4-.47-1.4-1.47v-46.62Z"/>
              <path d="M158.82,114.1c0-1,.67-1.47,1.4-1.47h10.02c.93,0,1.4.47,1.4,1.47v36.27h18.57c.93,0,1.4.53,1.4,1.47v8.88c0,1-.47,1.47-1.4,1.47h-29.99c-.93,0-1.4-.47-1.4-1.47v-46.62Z"/>
              <path d="M218.74,160.76c-.33,1-1,1.47-2,1.47h-7.82c-1,0-1.67-.47-2.07-1.47l-17.9-46.69c-.4-1,0-1.47.93-1.47l10.69.07c.93,0,1.6.4,1.94,1.47l10.29,29.92,10.15-29.92c.33-1,1.07-1.47,2-1.47h10.75c1,0,1.34.47.94,1.47l-17.9,46.62Z"/>
            </svg>
          </a>
        </div>

        <!-- Centered Navigation: Accueil, Matières, To-do List, Colles, Notes + Marguerite Sticker -->
        <nav class="hidden md:flex items-center justify-center gap-1.5 bg-creme-200/90 dark:bg-ink-darkcard p-1.5 rounded-2xl border border-creme-300 dark:border-ink-border mx-auto shadow-xs" id="desktop-nav">
          <button data-page="dashboard" class="nav-btn active flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all">
            <i data-lucide="calendar" class="w-4 h-4"></i>
            <span>Accueil</span>
          </button>
          <button data-page="subjects" class="nav-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>Matières</span>
          </button>
          <button data-page="longterm" class="nav-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span>To-do List</span>
          </button>
          <button data-page="flashcards" class="nav-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span>Colles</span>
          </button>
          <button data-page="grades" class="nav-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold transition-all">
            <i data-lucide="calculator" class="w-4 h-4"></i>
            <span>Notes</span>
          </button>

          <!-- Sticker Marguerite Rose Pop & Solaire à l'extrémité droite du menu -->
          <div class="daisy-sticker flex-shrink-0 px-2 py-0.5 select-none cursor-pointer" title="🌸 Marguerite Pop & Solaire">
            <svg width="26" height="26" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g fill="#ff3366">
                <ellipse cx="18" cy="5.5" rx="3.3" ry="5.5" />
                <ellipse cx="18" cy="30.5" rx="3.3" ry="5.5" />
                <ellipse cx="5.5" cy="18" rx="5.5" ry="3.3" />
                <ellipse cx="30.5" cy="18" rx="5.5" ry="3.3" />
                <ellipse cx="9.2" cy="9.2" rx="3.3" ry="5.5" transform="rotate(-45 9.2 9.2)" fill="#ff4d79" />
                <ellipse cx="26.8" cy="26.8" rx="3.3" ry="5.5" transform="rotate(-45 26.8 26.8)" fill="#ff4d79" />
                <ellipse cx="26.8" cy="9.2" rx="3.3" ry="5.5" transform="rotate(45 26.8 9.2)" fill="#ff4d79" />
                <ellipse cx="9.2" cy="26.8" rx="3.3" ry="5.5" transform="rotate(45 9.2 26.8)" fill="#ff4d79" />
              </g>
              <circle cx="18" cy="18" r="5.5" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5" />
            </svg>
          </div>
        </nav>

        <!-- Right actions: Dark/Light toggle + GitHub Sync -->
        <div class="flex items-center gap-2 ml-auto md:ml-0 flex-shrink-0">
          
          <!-- Dark / Light Mode Toggle -->
          <button id="theme-toggle-btn" title="Basculer Mode Clair / Sombre" class="p-2 rounded-xl text-ink dark:text-zinc-300 hover:bg-creme-200 dark:hover:bg-ink-darkcard border border-creme-300 dark:border-ink-border transition-all">
            <i data-lucide="moon" class="w-4 h-4 hidden dark:block text-orangePop-400"></i>
            <i data-lucide="sun" class="w-4 h-4 block dark:hidden text-orangePop-500"></i>
          </button>

          <!-- GitHub Cloud Sync Button & Status Indicator -->
          <button id="github-sync-btn" title="Synchronisation GitHub (data.json)" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-creme-200 hover:bg-creme-300 dark:bg-ink-darkcard dark:hover:bg-zinc-800 text-ink dark:text-zinc-200 border border-creme-300 dark:border-ink-border transition-all shadow-xs">
            <span id="github-sync-indicator" class="w-2 h-2 rounded-full bg-zinc-400 inline-block transition-colors"></span>
            <i data-lucide="github" class="w-3.5 h-3.5 text-ink dark:text-white"></i>
            <span id="github-sync-label" class="hidden sm:inline">GitHub Sync</span>
          </button>

        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Area (Immersif et Plein Écran) -->
  <main class="flex-1 max-w-[1800px] w-full mx-auto px-3 sm:px-5 lg:px-6 py-4 sm:py-5 pb-24 md:pb-8 flex flex-col">
    
    <!-- View 1: Accueil / Dashboard -->
    <section id="view-dashboard" class="page-view active animate-fade-in flex-1 flex flex-col"></section>

    <!-- View 2: Matières -->
    <section id="view-subjects" class="page-view hidden animate-fade-in"></section>

    <!-- View 3: To-do List -->
    <section id="view-longterm" class="page-view hidden animate-fade-in"></section>

    <!-- View 4: Colles & Flashcards -->
    <section id="view-flashcards" class="page-view hidden animate-fade-in"></section>

    <!-- View 5: Notes & Semestre -->
    <section id="view-grades" class="page-view hidden animate-fade-in"></section>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-creme-100/95 dark:bg-ink-darkbg/95 backdrop-blur-lg border-t border-creme-300 dark:border-ink-border px-2 py-2 flex justify-around items-center transition-colors shadow-lg" id="mobile-nav">
    <button data-page="dashboard" class="mobile-nav-btn active flex flex-col items-center gap-0.5 p-1 rounded-xl text-[11px] font-bold">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span>Accueil</span>
    </button>
    <button data-page="subjects" class="mobile-nav-btn flex flex-col items-center gap-0.5 p-1 rounded-xl text-[11px] font-bold">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span>Matières</span>
    </button>
    <button data-page="longterm" class="mobile-nav-btn flex flex-col items-center gap-0.5 p-1 rounded-xl text-[11px] font-bold">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span>To-do</span>
    </button>
    <button data-page="flashcards" class="mobile-nav-btn flex flex-col items-center gap-0.5 p-1 rounded-xl text-[11px] font-bold">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span>Colles</span>
    </button>
    <button data-page="grades" class="mobile-nav-btn flex flex-col items-center gap-0.5 p-1 rounded-xl text-[11px] font-bold">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span>Notes</span>
    </button>
  </nav>

  <!-- Global Drawers (Tiroirs Coulissants) Container -->
  <div id="drawers-root"></div>

  <!-- Global Modals Container -->
  <div id="modals-root"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none"></div>

  <!-- Hidden file input for JSON import -->
  <input type="file" id="global-json-import-input" accept=".json,application/json" class="hidden">

  <!-- Standalone Application Script -->
  <script src="app.js"></script>
</body>
</html>
